services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: homelab-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp"
    volumes:
      - ./wireguard:/gluetun/wireguard:ro
    env_file:
      - .env
    restart: unless-stopped
